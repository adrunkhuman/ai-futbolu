# Video stage (video.py): Hedra Character 3 lip-syncs close-ups; the wide shot is silent "people moving".
[video]
resolution = "540p"             # Hedra renders this tier at 832x480
size = [832, 480]
fps = 25
price_per_second = 0.025        # USD, hedra-character-3 at 540p (`hedra-cli models get --model hedra-character-3`)
long_turn_s = 25                # turns longer than this are lip-synced only at the start and end...
head_s = 10                     # ...first head_s seconds
tail_s = 5                      # ...and last tail_s seconds; the middle cuts to the wide shot
opening_wide_s = 3              # the episode opens on the wide shot
closing_wide_s = 4              # and ends on it
concurrency = 4
talk_prompt = "A TV football pundit in a studio speaks to the other guests: natural lip movement, subtle head movement, blinking and small expressions. Static camera."
ambient_s = 10
ambient_prompts = [
    "Four pundits sit at a TV panel desk listening to each other. Nobody speaks. They blink, breathe, shift slightly, glance at one another, one takes a note, one nods. Static locked-off camera.",
    "Four pundits at a TV panel desk follow a conversation: they glance left and right, lean a little, adjust their posture, one sips water, one leafs through papers. Static locked-off camera.",
    "Four pundits at a TV panel desk listen attentively: one nods slowly, one writes a note, one looks down at his papers, one raises a hand slightly. Static locked-off camera.",
]

