# Model ids verified against provider model lists on 2026-09-29.

[episode]
target_minutes = 18
hard_max_minutes = 20     # closing is forced once this many minutes of speech are reached
words_per_minute = 150    # Polish speech pace, used to estimate audio length from word count; calibrate on the first ElevenLabs render
closing_reserve_words = 500   # room left for host nudge + guests' last words + farewell
max_turns = 150
turn_max_words = 170          # longer turns are cut at a sentence boundary (models ignore the prompt's ~130)
closing_turn_max_words = 70   # guests' last words and intro replies

[show]
topic = "Reprezentacja Polski po porażce ze Szwecją: co poszło nie tak, mecz z Rumunią i dalsze kroki w grupie, oraz sytuacja selekcjonera Jana Urbana: zostawić czy zwolnić?"
agenda = "1) mecz ze Szwecją: co zawiodło; 2) mecz z Rumunią i dalsze kroki w grupie; 3) selekcjoner Urban: zostawić czy zwolnić"
name = "AI Futbolu"    # spoken "Ej Aj Futbolu" in TTS (see voices alias); parody of "Futbol Futbolu"

[director]
enabled = true              # Jev decides next speaker, interruptions, and move hints; off = rule-based turn taking
interrupt_scale = 0.8       # P(interrupt) = Jev's probability * this
min_gap_since_interrupt = 2 # at least this many turns between interruptions
temperature = 1.0           # <1 sharper next-speaker picks, >1 more random
steer_threshold = 0.65      # P(discussion drifted off the national team) that makes the host pull it back
italy_threshold = 0.6       # Kierski's one Italian anecdote: needs Jev's "fits here" probability above this
italy_late_turn = 14        # after this many turns the threshold drops to 0.4
italy_force_turn = 22       # after this many turns it is told regardless
steer_cooldown = 5          # turns between steering interventions
max_silence_turns = 6       # a panelist silent this long is brought in next
stale_threshold = 0.8       # "they keep repeating the point" nudge: rare and late on purpose
stale_min_turns = 8
move_min_confidence = 0.5   # apply Jev's suggested move hint only when it is this confident

# `aliases` are the forms in which colleagues address a seat (Polish vocative etc.);
